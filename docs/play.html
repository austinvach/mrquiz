<!doctype html>
<html lang="en" class="h-screen">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png" sizes="any">
    <title>Mr.Quiz</title>
</head>

<body class="overflow-hidden text-center h-full flex flex-col">
    <!-- GAME BOARD -->
    <div id="main" class="grow flex flex-col content-center mx-auto justify-center">
        <div id="codeEntryScreen" class="m-4 flex flex-col md:flex-row">
            <div>
                <input id="codeEntryInput" type="tel" pattern="\d*" maxlength="4" placeholder="Enter Code" class="focus:outline-none focus-within:outline-none input input-bordered w-full max-w-xs invalid:input-error"/>
                <div class="label">
                    <span id="codeEntryInputLabel" class="label-text-alt invisible">PLACEHOLDER</span>
                </div>
            </div>
            <button id="codeSubmit" class="ml-2 btn" disabled>Submit</button>
        </div>
        <div id="questionScreen" class="m-4 flex hidden">
            HELLO
        </div>
    </div>
    <footer id="footer" class="py-4">
        <a href="https://vokrox.com" class="link">VOKROX</a>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
