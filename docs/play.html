<!doctype html>
<html lang="en" class="h-screen">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png" sizes="any">
    <title>Mr.Quiz | Stay Curious</title>
</head>

<body class="overflow-hidden text-center h-full flex flex-col">
    <!-- GAME BOARD -->
    <div id="main" class="grow flex flex-col content-center mx-auto justify-center">
        <div class="m-4">
            <div id="primaryText" class="mb-2"></div>
            <div>
                <input id="inputElement" type="tel" pattern="\d*" maxlength="4" class="text-center focus:outline-none focus-within:outline-none input input-bordered w-full max-w-xs text-3xl invalid:input-error"/>
                <div id="inputLabel" class="label mx-auto label-text-alt invisible">PLACEHOLDER</div>
            </div>
            <button id="submitButton" class="ml-2 btn" disabled>Submit</button>
        </div>
    </div>
    <footer id="footer" class="py-4">
        <a href="https://vokrox.com" class="link">VOKROX</a>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
